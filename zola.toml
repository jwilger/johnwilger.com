base_url = "https://johnwilger.com"
title = "John Wilger"
description = "John Wilger, Head of Engineering at 10kR, writes about leading teams, designing software, and where AI helps in engineering."
default_language = "en"

# Build settings
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]
compile_sass = true
minify_html = false
# Keep archived synthetic narrations out of the generated site.
ignored_static = ["audio/blog/**"]

# Taxonomies
taxonomies = [
    { name = "tags", feed = true, paginate_by = 10 },
]



[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[search]
include_title = true
include_description = true
include_content = true
